name: CipherPass Multiplatform Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux (.deb & .AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2
      - name: Build frontend & Linux bundles
        run: |
          npm ci
          npx tauri build --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: cipherpass-linux-deb-appimage
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage

  build-windows:
    name: Windows (.exe NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build frontend & Windows .exe installer
        run: |
          npm ci
          npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: cipherpass-windows-exe
          path: target/release/bundle/nsis/*.exe

  build-android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure preinstalled Android SDK & install NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "ndk;27.2.12479018" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> $GITHUB_ENV
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Initialize, harden Android manifest/theme, apply Logo & build signed APK
        run: |
          APP_VER=$(node -p "require('./package.json').version")
          npm ci
          npx tauri android init --ci
          npx tauri icon src-tauri/icons/app-icon-source.png

          python3 - <<'PYEOF'
          import glob, os

          # 1. Harden AndroidManifest.xml (biometrics, all-folder storage, allowBackup=false, adjustResize)
          manifest = "src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          m = open(manifest, "r", encoding="utf-8").read()
          perms = [
              '<uses-permission android:name="android.permission.USE_BIOMETRIC" />',
              '<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />',
              '<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />',
              '<uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />',
          ]
          inject_perms = "\n    ".join(p for p in perms if p not in m)
          if inject_perms:
              m = m.replace("<application", f"    {inject_perms}\n    <application", 1)
          if 'android:allowBackup=' not in m:
              m = m.replace("<application", '<application android:allowBackup="false" android:requestLegacyExternalStorage="true"', 1)
          else:
              m = m.replace('android:allowBackup="true"', 'android:allowBackup="false" android:requestLegacyExternalStorage="true"')
          if 'android:windowSoftInputMode=' not in m:
              m = m.replace("<activity", '<activity android:windowSoftInputMode="adjustResize"', 1)
          open(manifest, "w", encoding="utf-8").write(m)
          print("Patched AndroidManifest.xml successfully")

          # 2. Style Android status/nav bars to Obsidian #07090F with crisp white icons
          for theme_file in glob.glob("src-tauri/gen/android/app/src/main/res/values*/themes.xml"):
              t = open(theme_file, "r", encoding="utf-8").read()
              items = """
                  <item name="android:statusBarColor">#07090F</item>
                  <item name="android:navigationBarColor">#07090F</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowBackground">#07090F</item>
              """
              if "statusBarColor" not in t and "</style>" in t:
                  t = t.replace("</style>", items + "\n    </style>", 1)
                  open(theme_file, "w", encoding="utf-8").write(t)
                  print("Patched theme:", theme_file)
          PYEOF

          npx tauri android build --apk --target aarch64

          UNSIGNED_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$UNSIGNED_APK" ]; then
            echo "ERROR: Unsigned APK not found!"
            exit 1
          fi

          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          mkdir -p dist-apk
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED_APK" dist-apk/aligned.apk

          keytool -genkeypair -v \
            -keystore dist-apk/cipherpass-release.keystore \
            -storetype PKCS12 \
            -alias cipherpass \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -storepass "CipherPassAutoSign2026" \
            -keypass "CipherPassAutoSign2026" \
            -dname "CN=CipherPass, OU=Security, O=voidechoes7, L=Offline, S=Vault, C=US"

          OUT_APK="dist-apk/CipherPass-v${APP_VER}-android-signed.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks dist-apk/cipherpass-release.keystore \
            --ks-key-alias cipherpass \
            --ks-pass pass:CipherPassAutoSign2026 \
            --key-pass pass:CipherPassAutoSign2026 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$OUT_APK" \
            dist-apk/aligned.apk

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$OUT_APK"
          ls -lh "$OUT_APK"
      - uses: actions/upload-artifact@v4
        with:
          name: cipherpass-android-apk
          path: dist-apk/CipherPass-v*-android-signed.apk

  build-ios:
    name: iOS (.ipa unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - name: Install frontend, initialize iOS project & apply Holo Quantum Logo
        run: |
          npm ci
          npm run build
          npx tauri ios init --ci
          npx tauri icon src-tauri/icons/app-icon-source.png
          PLIST=$(find src-tauri/gen/apple -name "Info.plist" | head -n 1)
          if [ -n "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string Authenticate with Face ID to decrypt your CipherPass KDBX 4 vault." "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Set :NSFaceIDUsageDescription Authenticate with Face ID to decrypt your CipherPass KDBX 4 vault." "$PLIST"
          fi
      - name: Build unsigned iOS archive & package .ipa
        run: |
          APP_VER=$(node -p "require('./package.json').version")
          python3 -c '
          p = "src-tauri/gen/apple/cipherpass.xcodeproj/project.pbxproj"
          s = open(p).read()
          inject = "buildSettings = {\n\t\t\t\tCODE_SIGN_STYLE = Manual;\n\t\t\t\tCODE_SIGN_IDENTITY = \"\";\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tDEVELOPMENT_TEAM = \"\";"
          s = s.replace("buildSettings = {", inject)
          open(p, "w").write(s)
          '
          npx tauri ios build --target aarch64 --ci || true
          APP_PATH=$(find src-tauri/gen/apple/build ~/Library/Developer/Xcode/DerivedData -name "CipherPass.app" -type d 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No CipherPass.app bundle produced by tauri ios build!"
            exit 1
          fi
          echo "Packaging unsigned IPA from: $APP_PATH"
          mkdir -p src-tauri/gen/apple/build/ipa/Payload
          cp -R "$APP_PATH" src-tauri/gen/apple/build/ipa/Payload/
          cd src-tauri/gen/apple/build/ipa
          zip -r "CipherPass-v${APP_VER}-unsigned.ipa" Payload
          ls -lh "CipherPass-v${APP_VER}-unsigned.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: cipherpass-ios-unsigned-ipa
          path: src-tauri/gen/apple/build/ipa/CipherPass-v*-unsigned.ipa

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows, build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Flatten release assets & generate SHA256SUMS.txt
        run: |
          mkdir -p dist-release
          find release-assets -type f \( -name "*.exe" -o -name "*.apk" -o -name "*.ipa" -o -name "*.deb" -o -name "*.AppImage" \) -exec cp {} dist-release/ \;
          (cd dist-release && sha256sum * > SHA256SUMS.txt)
          cat dist-release/SHA256SUMS.txt
          ls -lh dist-release
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_VER=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            TAG="v${APP_VER}"
          fi
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" dist-release/* \
            --title "CipherPass $TAG" \
            --notes "CipherPass $TAG — 100% Offline KDBX 4 / 4.1 + NIST FIPS 203 ML-KEM-1024 Password Manager. Includes In-App Folder Browser & Move Vault (any phone/PC folder), fixed Android safe-area alignment & dark status bar, non-blocking Argon2id, Biometric Vault Unlock bound to Master Key, structured Entry Editor templates, Mobile Folder Pills, 1-tap Quick-Copy, and SHA256SUMS.txt integrity verification."
