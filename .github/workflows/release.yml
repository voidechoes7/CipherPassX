name: CipherPass Multiplatform Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux (.deb & .AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2
      - name: Build frontend & Linux bundles
        run: |
          npm ci
          npx tauri build --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: cipherpass-linux-deb-appimage
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage

  build-windows:
    name: Windows (.exe NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build frontend & Windows .exe installer
        run: |
          npm ci
          npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: cipherpass-windows-exe
          path: target/release/bundle/nsis/*.exe

  build-android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure preinstalled Android SDK & install NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "ndk;27.2.12479018" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> $GITHUB_ENV
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Initialize & build Android APK
        run: |
          npm ci
          npx tauri android init --ci
          npx tauri android build --apk --target aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: cipherpass-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  build-ios:
    name: iOS (.ipa unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - name: Install frontend & initialize iOS project
        run: |
          npm ci
          npm run build
          npx tauri ios init --ci
      - name: Build unsigned iOS archive & package .ipa
        run: |
          python3 -c '
          p = "src-tauri/gen/apple/cipherpass.xcodeproj/project.pbxproj"
          s = open(p).read()
          inject = "buildSettings = {\n\t\t\t\tCODE_SIGN_STYLE = Manual;\n\t\t\t\tCODE_SIGN_IDENTITY = \"\";\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tDEVELOPMENT_TEAM = \"\";"
          s = s.replace("buildSettings = {", inject)
          open(p, "w").write(s)
          '
          npx tauri ios build --target aarch64 --ci || true
          APP_PATH=$(find src-tauri/gen/apple/build ~/Library/Developer/Xcode/DerivedData -name "CipherPass.app" -type d 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No CipherPass.app bundle produced by tauri ios build!"
            exit 1
          fi
          echo "Packaging unsigned IPA from: $APP_PATH"
          mkdir -p src-tauri/gen/apple/build/ipa/Payload
          cp -R "$APP_PATH" src-tauri/gen/apple/build/ipa/Payload/
          cd src-tauri/gen/apple/build/ipa
          zip -r CipherPass-unsigned.ipa Payload
          ls -lh CipherPass-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: cipherpass-ios-unsigned-ipa
          path: src-tauri/gen/apple/build/ipa/CipherPass-unsigned.ipa

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows, build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Flatten release assets
        run: |
          mkdir -p dist-release
          find release-assets -type f \( -name "*.exe" -o -name "*.apk" -o -name "*.ipa" -o -name "*.deb" -o -name "*.AppImage" \) -exec cp {} dist-release/ \;
          ls -la dist-release
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            TAG="v0.1.0-latest"
          fi
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" dist-release/* \
            --title "CipherPass $TAG" \
            --notes "100% Offline Post-Quantum Hardened KeePass KDBX 4 / 4.1 Password Manager (Windows .exe, Android .apk, iOS .ipa unsigned, Linux .deb & .AppImage)."
