name: CipherPass Multiplatform Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux (.deb & .AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2
      - name: Build frontend & Linux bundles
        run: |
          npm ci
          npx tauri build --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: cipherpass-linux-deb-appimage
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage

  build-windows:
    name: Windows (.exe NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build frontend & Windows .exe installer
        run: |
          npm ci
          npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: cipherpass-windows-exe
          path: target/release/bundle/nsis/*.exe

  build-android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure preinstalled Android SDK & install NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "ndk;27.2.12479018" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> $GITHUB_ENV
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Initialize, harden Android manifest/theme, apply Logo & build signed APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          APP_VER=$(node -p "require('./package.json').version")
          npm ci
          npx tauri android init --ci
          npx tauri icon src-tauri/icons/app-icon-source.png

          APP_VER="$APP_VER" python3 - <<'PYEOF'
          import glob, os, re

          # 1. Harden AndroidManifest.xml (biometrics, all-folder storage, allowBackup=false, adjustResize)
          manifest = "src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          m = open(manifest, "r", encoding="utf-8").read()
          perms = [
              '<uses-permission android:name="android.permission.USE_BIOMETRIC" />',
              '<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />',
              '<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />',
              '<uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />',
          ]
          inject_perms = "\n    ".join(p for p in perms if p not in m)
          if inject_perms:
              m = m.replace("<application", f"    {inject_perms}\n    <application", 1)
          if 'android:allowBackup=' not in m:
              m = m.replace("<application", '<application android:allowBackup="false" android:requestLegacyExternalStorage="true"', 1)
          else:
              m = m.replace('android:allowBackup="true"', 'android:allowBackup="false" android:requestLegacyExternalStorage="true"')
          if 'android:usesCleartextTraffic=' in m:
              m = re.sub(r'android:usesCleartextTraffic="[^"]*"', 'android:usesCleartextTraffic="false"', m)
          else:
              m = m.replace("<application", '<application android:usesCleartextTraffic="false"', 1)
          if 'android:windowSoftInputMode=' not in m:
              m = m.replace("<activity", '<activity android:windowSoftInputMode="adjustResize"', 1)
          open(manifest, "w", encoding="utf-8").write(m)
          print("Patched AndroidManifest.xml successfully")

          # 2. Style Android status/nav bars to Obsidian #07090F with crisp white icons
          for theme_file in glob.glob("src-tauri/gen/android/app/src/main/res/values*/themes.xml"):
              t = open(theme_file, "r", encoding="utf-8").read()
              items = """
                  <item name="android:statusBarColor">#07090F</item>
                  <item name="android:navigationBarColor">#07090F</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowBackground">#07090F</item>
              """
              if "statusBarColor" not in t and "</style>" in t:
                  t = t.replace("</style>", items + "\n    </style>", 1)
                  open(theme_file, "w", encoding="utf-8").write(t)
                  print("Patched theme:", theme_file)

          # 3. Set deterministic monotonic versionCode (major*10000 + minor*100 + patch) for in-place updates
          ver = os.environ["APP_VER"].split("-")[0]
          parts = [int(x) for x in ver.split(".")[:3]]
          while len(parts) < 3:
              parts.append(0)
          ver_code = parts[0] * 10000 + parts[1] * 100 + parts[2]
          tauri_props = "src-tauri/gen/android/app/tauri.properties"
          if os.path.exists(tauri_props):
              tp = open(tauri_props, "r", encoding="utf-8").read()
              if "tauri.android.versionCode=" in tp:
                  tp = re.sub(r"tauri\.android\.versionCode=\d+", f"tauri.android.versionCode={ver_code}", tp)
              else:
                  tp += f"\ntauri.android.versionCode={ver_code}\n"
              if "tauri.android.versionName=" in tp:
                  tp = re.sub(r"tauri\.android\.versionName=.*", f"tauri.android.versionName={ver}", tp)
              open(tauri_props, "w", encoding="utf-8").write(tp)
              print(f"Patched tauri.properties: versionCode={ver_code}, versionName={ver}")
          # 4. Install custom MainActivity.kt with All Files Access (MANAGE_EXTERNAL_STORAGE)
          #    direct settings launcher + native Android OpenDocumentTree folder picker bridge
          import shutil
          src_activity = "src-tauri/android-templates/MainActivity.kt"
          dst_activity = "src-tauri/gen/android/app/src/main/java/com/voidechoes7/cipherpass/MainActivity.kt"
          if not os.path.exists(src_activity):
              raise RuntimeError(f"Missing {src_activity}")
          os.makedirs(os.path.dirname(dst_activity), exist_ok=True)
          shutil.copyfile(src_activity, dst_activity)
          print(f"Installed custom MainActivity.kt -> {dst_activity}")
          PYEOF

          npx tauri android build --apk --target aarch64

          UNSIGNED_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$UNSIGNED_APK" ]; then
            echo "ERROR: Unsigned APK not found!"
            exit 1
          fi

          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is missing!"
            exit 1
          fi

          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          mkdir -p dist-apk
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED_APK" dist-apk/aligned.apk

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > dist-apk/cipherpass-release.keystore

          OUT_APK="dist-apk/CipherPass-v${APP_VER}-android-signed.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks dist-apk/cipherpass-release.keystore \
            --ks-key-alias "${ANDROID_KEY_ALIAS:-cipherpass}" \
            --ks-pass "env:ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "env:ANDROID_KEY_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$OUT_APK" \
            dist-apk/aligned.apk

          rm -f dist-apk/cipherpass-release.keystore
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$OUT_APK"
          ls -lh "$OUT_APK"
      - uses: actions/upload-artifact@v4
        with:
          name: cipherpass-android-apk
          path: dist-apk/CipherPass-v*-android-signed.apk

  build-ios:
    name: iOS (.ipa unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - name: Install frontend, initialize iOS project & apply Holo Quantum Logo
        run: |
          npm ci
          npm run build
          npx tauri ios init --ci
          npx tauri icon src-tauri/icons/app-icon-source.png
          PLIST=$(find src-tauri/gen/apple -name "Info.plist" | head -n 1)
          if [ -n "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string Authenticate with Face ID to decrypt your CipherPass KDBX 4 vault." "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Set :NSFaceIDUsageDescription Authenticate with Face ID to decrypt your CipherPass KDBX 4 vault." "$PLIST"
          fi
      - name: Build unsigned iOS archive & package .ipa
        run: |
          APP_VER=$(node -p "require('./package.json').version")
          python3 -c '
          p = "src-tauri/gen/apple/cipherpass.xcodeproj/project.pbxproj"
          s = open(p).read()
          inject = "buildSettings = {\n\t\t\t\tCODE_SIGN_STYLE = Manual;\n\t\t\t\tCODE_SIGN_IDENTITY = \"\";\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tDEVELOPMENT_TEAM = \"\";"
          s = s.replace("buildSettings = {", inject)
          open(p, "w").write(s)
          '
          npx tauri ios build --target aarch64 --ci || true
          APP_PATH=$(find src-tauri/gen/apple/build ~/Library/Developer/Xcode/DerivedData -name "CipherPass.app" -type d 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No CipherPass.app bundle produced by tauri ios build!"
            exit 1
          fi
          echo "Packaging unsigned IPA from: $APP_PATH"
          mkdir -p src-tauri/gen/apple/build/ipa/Payload
          cp -R "$APP_PATH" src-tauri/gen/apple/build/ipa/Payload/
          cd src-tauri/gen/apple/build/ipa
          zip -r "CipherPass-v${APP_VER}-unsigned.ipa" Payload
          ls -lh "CipherPass-v${APP_VER}-unsigned.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: cipherpass-ios-unsigned-ipa
          path: src-tauri/gen/apple/build/ipa/CipherPass-v*-unsigned.ipa

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows, build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Flatten release assets & generate SHA256SUMS.txt
        run: |
          mkdir -p dist-release
          find release-assets -type f \( -name "*.exe" -o -name "*.apk" -o -name "*.ipa" -o -name "*.deb" -o -name "*.AppImage" \) -exec cp {} dist-release/ \;
          (cd dist-release && sha256sum * > SHA256SUMS.txt)
          cat dist-release/SHA256SUMS.txt
          ls -lh dist-release
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_VER=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            TAG="v${APP_VER}"
          fi
          NOTES="CipherPass $TAG — Accessibility, Long-Press Copy, Persistent Clipboard Timer & Transparent Security Audit: (1) Press-and-hold (long-press) any entry in your vault list to instantly copy its password with haptic & visual feedback and automatic clipboard wipe; (2) Instant Clipboard Auto-Clear Limit presets (10s / 15s / 30s / 45s / 60s / 2m / 5m) moved front-and-center in Settings with persistent storage across app restarts + 1-tap shortcut right from the vault list; (3) Optional Biometric Lock on App Storage List (Settings -> Privacy) to require fingerprint/Face ID before revealing .kdbx filenames on the Unlock Screen; (4) Security Audit now excludes Recycle Bin entries and displays a transparent Score Breakdown showing exact point deductions (weak, reused, expired, KDF); (5) Cleaner mobile header, search clear button, and roomier quick-action tap targets. Signed with persistent RSA-4096 keystore (versionCode 703) for seamless in-place updates over v0.7.2."
          ok=0
          for attempt in 1 2 3 4; do
            echo "::group::Publish attempt $attempt"
            gh release delete "$TAG" --yes || true
            if gh release create "$TAG" dist-release/* \
                --title "CipherPass $TAG" \
                --notes "$NOTES"; then
              ok=1
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
            echo "Publish attempt $attempt failed — retrying in $((attempt * 20))s..."
            sleep $((attempt * 20))
          done
          if [[ "$ok" != "1" ]]; then
            echo "::error::Failed to publish GitHub Release after 4 attempts"
            exit 1
          fi
